name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v

      - name: Byte-compile every Python file
        run: git ls-files '*.py' | xargs python -m py_compile

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every JavaScript file
        run: git ls-files '*.js' | xargs -n1 node --check
