name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and type-check tools (pinned)
        run: python -m pip install ruff==0.6.9 mypy==1.11.2

      - name: Lint (pyflakes-level)
        run: ruff check .

      - name: Type-check the typed modules
        run: mypy

      - name: Python unit tests (standard library only)
        run: python -m unittest discover -s tests -v

      - name: Byte-compile every Python file
        run: git ls-files '*.py' | xargs python -m py_compile

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript unit tests (node:test)
        run: node --test tests/js/draft_model.test.js tests/js/build_scene.test.js

      - name: Syntax-check every JavaScript file
        run: git ls-files '*.js' | xargs -n1 node --check
